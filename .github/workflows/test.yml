name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes whatever was still running for the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version that fails, not just the first.
      fail-fast: false
      matrix:
        # 20 is the floor npm test is documented against — the suite reads the
        # positions V8 puts in JSON.parse messages, and 18 leaves them out of
        # some of them. 24 is current.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  # The repository ships its build artifact, so a change can land without the
  # .vsix being rebuilt and the stale one is what gets installed. One version is
  # enough: this compares packages, not runtimes.
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check:package
